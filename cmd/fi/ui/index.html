<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FI</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="/wails/runtime.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Всё окно масштабируется под свой размер: app.js задаёт #scale ширину, высоту и масштаб. -->
  <div id="scale">
  <header class="titlebar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0E0C11"/>
        <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
        <path d="M7 7h12v4h-8v3h6v4h-6v7H7z" fill="#F1EEF3"/>
        <rect x="22" y="7" width="4" height="18" fill="#E5484D"/>
      </svg>
      <span>FI</span>
    </div>
    <div class="window-buttons">
      <button class="win-btn" data-action="minimize" title="Свернуть" aria-label="Свернуть">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
      <button class="win-btn" data-action="hide" title="Убрать в трей" aria-label="Убрать в трей">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  </div>
</body>
</html>
